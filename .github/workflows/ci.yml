name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: pin, format, lint, typecheck
        run: bun run verify pin format lint typecheck
      - name: conventional commits
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          HK_SHA256: 8ff0b29c9925d73df9b14af7fc43ace86de03db73eafa3046750fce5c39e1955
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/jdx/hk/releases/download/v2.13.0/hk-x86_64-unknown-linux-gnu.tar.gz -o "$RUNNER_TEMP/hk.tgz"
          echo "$HK_SHA256  $RUNNER_TEMP/hk.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/hk" && tar xzf "$RUNNER_TEMP/hk.tgz" -C "$RUNNER_TEMP/hk"
          PATH="$RUNNER_TEMP/hk:$PATH" bun scripts/check-commits.ts \
            "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
      - uses: ./.github/actions/setup
      - name: full test suite
        run: bun run verify test

  test-changed:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A pull request checks out GitHub's merge commit, whose first parent
      # is the base: two commits of history give the PR's whole diff (D9).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 2
      - uses: ./.github/actions/setup
      - name: tests the diff can reach
        env:
          GERCH_TEST_BASE: HEAD^1
        run: bun scripts/select-tests.ts

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
      - uses: ./.github/actions/setup
      - name: build
        run: bun run verify build
      - name: build with React DOM, the fallback renderer
        run: bun run build
        env:
          GERCH_RENDERER: react-dom

  # Four shards on separate runners, balanced by main's flow times. Shard 1
  # keeps the name `e2e`; the others are e2e-2 to e2e-4. All four are required.
  e2e:
    name: ${{ matrix.shard == 1 && 'e2e' || format('e2e-{0}', matrix.shard) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
      - uses: ./.github/actions/setup
      # Playwright's headless shell starts in a fraction of the time the
      # runner's Google Chrome takes (D9). Cached per Playwright version;
      # only main saves the cache, like node_modules.
      - id: playwright
        shell: bash
        run: echo "version=$(jq -r '.devDependencies["@playwright/test"]' package.json)" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: bun x playwright install chromium-headless-shell
      - if: steps.browsers.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.shard == 1
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browsers.outputs.cache-primary-key }}
      # Each flow's time on main's latest run, for balancing the shards (D37).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .e2e-timings.json
          key: e2e-timings-${{ github.run_id }}
          restore-keys: e2e-timings-
      - name: end-to-end flows (Playwright's headless shell, recorded fixtures)
        run: bun scripts/e2e-shards.ts run ${{ matrix.shard }} 4
      - name: the four shards run every flow once
        if: ${{ !cancelled() }}
        run: bun scripts/e2e-shards.ts check ${{ matrix.shard }} 4
      - name: keep this shard's flow times
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report-${{ matrix.shard }}
          path: e2e-report.json
          retention-days: 1

  # Merges the four shards' flow times on main, so the next runs balance by
  # them (D37). Not required, and nothing waits on it.
  e2e-timings:
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-report-*
          path: reports
      - name: merge the shard reports
        run: bun scripts/e2e-shards.ts record reports/*/e2e-report.json > .e2e-timings.json
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .e2e-timings.json
          key: e2e-timings-${{ github.run_id }}
