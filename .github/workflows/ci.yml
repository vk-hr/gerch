name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

env:
  GERCH_JOB_BUDGET_MS: "35000"
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: pin, format, lint, typecheck
        run: bun run verify pin format lint typecheck
      - name: conventional commits
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          HK_SHA256: 8ff0b29c9925d73df9b14af7fc43ace86de03db73eafa3046750fce5c39e1955
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/jdx/hk/releases/download/v2.13.0/hk-x86_64-unknown-linux-gnu.tar.gz -o "$RUNNER_TEMP/hk.tgz"
          echo "$HK_SHA256  $RUNNER_TEMP/hk.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/hk" && tar xzf "$RUNNER_TEMP/hk.tgz" -C "$RUNNER_TEMP/hk"
          PATH="$RUNNER_TEMP/hk:$PATH" bun scripts/check-commits.ts \
            "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
      - name: budget
        if: ${{ !cancelled() }}
        run: bun scripts/ci-budget.ts

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
      - uses: ./.github/actions/setup
      - name: full test suite
        run: bun run verify test
      - name: budget
        if: ${{ !cancelled() }}
        run: bun scripts/ci-budget.ts

  test-changed:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A pull request checks out GitHub's merge commit, whose first parent
      # is the base: two commits of history give the PR's whole diff (D9).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 2
      - uses: ./.github/actions/setup
      - name: tests the diff can reach
        env:
          GERCH_TEST_BASE: HEAD^1
        run: bun scripts/select-tests.ts
      - name: budget
        if: ${{ !cancelled() }}
        run: bun scripts/ci-budget.ts

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
      - uses: ./.github/actions/setup
      - name: build
        run: bun run verify build
      - name: build with React DOM, the fallback renderer
        run: bun run build
        env:
          GERCH_RENDERER: react-dom
      - name: budget
        if: ${{ !cancelled() }}
        run: bun scripts/ci-budget.ts

  # Four shards on separate runners keep each job under 35 s. Shard 1 keeps
  # the name `e2e`, the required check; the others are e2e-2 to e2e-4.
  e2e:
    name: ${{ matrix.shard == 1 && 'e2e' || format('e2e-{0}', matrix.shard) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      GERCH_JOB_NAME: ${{ matrix.shard == 1 && 'e2e' || format('e2e-{0}', matrix.shard) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
      - uses: ./.github/actions/setup
      # Playwright's headless shell starts in a fraction of the time the
      # runner's Google Chrome takes (D9). Cached per Playwright version;
      # only main saves the cache, like node_modules.
      - id: playwright
        shell: bash
        run: echo "version=$(jq -r '.devDependencies["@playwright/test"]' package.json)" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: bun x playwright install chromium-headless-shell
      - if: steps.browsers.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.shard == 1
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browsers.outputs.cache-primary-key }}
      - name: end-to-end flows (Playwright's headless shell, recorded fixtures)
        run: bun x playwright test --shard=${{ matrix.shard }}/4
      - name: the four shards run every flow once
        if: ${{ !cancelled() }}
        run: bun scripts/check-e2e-shards.ts 4
      - name: budget
        if: ${{ !cancelled() }}
        run: bun scripts/ci-budget.ts
